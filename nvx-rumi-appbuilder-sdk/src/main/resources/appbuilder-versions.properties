# Filtered at build time by Maven. Do not edit the values -- they come from the
# root pom, which is the point: a default version written as a Java literal
# drifts to something unpublished and nothing notices until a generated app
# fails to PACKAGE, minutes later, with an error naming a repository (RUMI-443).
nvx.rumi.management.version=${nvx.rumi.management.version}
nvx.rumi.version=${nvx.rumi.version}
