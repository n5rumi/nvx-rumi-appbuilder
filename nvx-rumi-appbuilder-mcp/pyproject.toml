[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rumi-appbuilder-mcp"
version = "1.0.0.dev0"
description = "MCP server wrapping the Rumi App Builder REST service"
readme = "PROJECT.md"
requires-python = ">=3.11"
authors = [
    { name = "N5 Technologies, Inc." }
]
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.4.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
rumi-appbuilder-mcp = "rumi_appbuilder_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
