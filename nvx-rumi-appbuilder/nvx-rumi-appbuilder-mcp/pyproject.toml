[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rumi-appbuilder-mcp"
version = "1.0.0.dev0"
description = "MCP server wrapping the Rumi App Builder REST service"
readme = "PROJECT.md"
requires-python = ">=3.11"
authors = [
    { name = "N5 Technologies, Inc." }
]
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned versions filled in during implementation — see PROJECT.md
    # "Tech Stack" and "Open Questions".
    # "mcp>=...",
    # "httpx>=0.27",
]

[project.scripts]
rumi-appbuilder-mcp = "rumi_appbuilder_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
